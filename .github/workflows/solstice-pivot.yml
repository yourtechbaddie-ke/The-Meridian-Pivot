name: Solstice Pivot Event CI

on:
  push:
    paths:
      - 'pivot-event/solstice-events-co/**'
      - '.github/workflows/solstice-pivot.yml'
  pull_request:
    paths:
      - 'pivot-event/solstice-events-co/**'
      - '.github/workflows/solstice-pivot.yml'
  workflow_dispatch:

concurrency:
  group: solstice-pivot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pivot-event/solstice-events-co
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Verify application module loads
        env:
          NODE_ENV: test
          DB_FILE: ${{ runner.temp }}/solstice-module-load.db
          WEBHOOK_SECRET: ci-test-secret
        run: node -e "import('./src/server.js').then(() => console.log('Application module loaded successfully'))"

      - name: Run test suite
        env:
          NODE_ENV: test
          DB_FILE: ${{ runner.temp }}/solstice-test.db
          WEBHOOK_SECRET: ci-test-secret
        run: npm test
