name: Solstice Pivot Event CI

on:
  push:
    paths:
      - 'pivot-event/solstice-events-co/**'
      - '.github/workflows/solstice-pivot.yml'
  pull_request:
    paths:
      - 'pivot-event/solstice-events-co/**'
      - '.github/workflows/solstice-pivot.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pivot-event/solstice-events-co
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pivot-event/solstice-events-co/package.json
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
